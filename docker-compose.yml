version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:NewPassword123@db:5432/postmortem-ai
    depends_on:
      - db

  db:
    image: pgvector/pgvector:pg16
    container_name: postmortem_postgres
    ports:
      - "2907:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: NewPassword123
      POSTGRES_DB: postmortem-ai
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
